frentes:

  ia_aplicada:
    name: IA Aplicada
    priority: 10
    keywords:
      # Agentes: execução, avaliação, segurança, identidade, observabilidade e custo.
      - AI agents production deployment
      - AI agent evaluation production
      - AI agent security prompt injection
      - AI agent identity permissions
      - AI agent observability monitoring
      - AI agent cost token economics
      - agentic AI enterprise adoption
      - AI pilot to production failure
      # Casos de uso e operação.
      - AI in supply chain use cases
      - AI logistics forecasting routing
      - AI operations productivity
      - AI customer service operations
      - generative AI supply chain examples
      - AI decision making operations
      - human in the loop AI operations
      - AI data quality supply chain
      - AI automation failure operations
      - AI adoption barriers enterprise
    research_questions:
      - "Quem está usando IA em produção, e para quê?"
      - "Que ganhos estão sendo relatados: tempo, custo, qualidade ou receita?"
      - "Quais aplicações falharam?"
      - "Onde a decisão humana continua indispensável?"
      - "Quais competências os líderes precisam desenvolver?"
      - "O debate está falando de automação ou de aumento da capacidade das equipes?"
      - "Quais casos são reais e quais são apenas marketing?"
      - "O agente executa a ação (write real) ou só recomenda?"
      - "Como o agente é avaliado depois do deploy?"
      - "Quem tem autoridade para interromper o agente?"
      - "Quanto custa cada execução e onde o custo aparece?"
    exploratory_questions:
      - "Que prática de IA está sendo abandonada depois de uma tentativa de adoção?"
      - "Que efeito inesperado apareceu depois que a IA entrou no trabalho real?"
      - "Onde eficiência e qualidade entram em conflito quando uma equipe usa IA?"
      - "Quem ganhou ou perdeu poder de decisão depois da automação?"
      - "Que setor resolveu um problema operacional com IA de maneira contraintuitiva?"

  logistica_last_mile_cx:
    name: Logística, last mile e experiência do cliente
    priority: 9
    keywords:
      - last mile delivery customer experience
      - delivery speed cost tradeoff
      - logistics operational efficiency
      - food delivery operations
      - delivery reliability customer complaints
      # Promessa, custo, recuperação e SLA.
      - delivery promise reliability
      - last mile cost per delivery
      - customer recovery service failure
      - delivery SLA compliance
    exploratory_questions:
      - "Que etapa da entrega está mudando sem aparecer na métrica de prazo?"
      - "Onde uma promessa de conveniência criou um custo ou conflito inesperado?"
      - "Quem absorve o trabalho invisível quando uma entrega falha?"
      - "Que comportamento de cliente ou operador está redesenhando a última milha?"
      - "Que setor encontrou uma solução contraintuitiva para confiabilidade de entrega?"

  lideranca_operacoes:
    name: Liderança em operações
    priority: 8
    keywords:
      - operations leadership challenges
      - delegation and accountability leadership
      - building trust in operational teams
      - frontline workforce productivity
      - decision making under pressure leadership
      # Cobrança, priorização, pressão e accountability na linha de frente.
      - accountability difficult conversations leadership
      - leader prioritization attention management
      - operational leadership under pressure
      - frontline accountability performance
    exploratory_questions:
      - "Que prática de liderança está sendo abandonada por não produzir autonomia?"
      - "Que efeito inesperado surgiu quando uma equipe ganhou mais autonomia?"
      - "Onde cobrança por eficiência entrou em conflito com confiança ou aprendizado?"
      - "Quem ganhou ou perdeu poder depois de uma mudança no desenho das decisões?"
      - "Que organização resolveu um problema de gestão de maneira contraintuitiva?"

  riscos_compliance_resiliencia:
    name: Riscos, compliance e resiliência
    priority: 8
    keywords:
      - supply chain risk management
      - operational resilience
      - AI governance compliance business
      - food safety supply chain
      - supplier risk technology
      # Regulação, segurança de agente, incidente e evidência de auditoria.
      - EU AI Act enforcement
      - Cyber Resilience Act compliance
      - AI agent security governance
      - AI incident response
      - AI audit evidence operational
    exploratory_questions:
      - "Que controle está sendo retirado ou reforçado depois de um incidente?"
      - "Que consequência inesperada apareceu quando uma regra passou a ser aplicada?"
      - "Onde conformidade e velocidade operacional entram em conflito?"
      - "Quem passa a responder pelo risco quando uma decisão é automatizada?"
      - "Que setor resolveu um problema de resiliência de maneira contraintuitiva?"

  alimentos_consumo_sustentabilidade:
    name: Alimentos, consumo e sustentabilidade
    priority: 4
    keywords:
      - food industry trends
      - functional foods market
      - food supply chain innovation
      - circular economy operations
      - sustainable logistics cost
      # Desperdício, ingredientes, segurança alimentar e clima.
      - food waste reduction operations
      - upcycled ingredients food
      - food safety incident response
      - climate risk food supply chain
    exploratory_questions:
      - "Que prática de consumo ou produção está sendo abandonada por mudar o custo?"
      - "Que efeito inesperado apareceu depois de uma mudança na cadeia de alimentos?"
      - "Onde sustentabilidade e margem entram em conflito na operação?"
      - "Quem absorve o custo quando uma solução sustentável muda o fluxo?"
      - "Que empresa ou setor resolveu um problema alimentar de maneira contraintuitiva?"
