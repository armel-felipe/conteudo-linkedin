run_id: run_YYYYMMDD_NNN
created_at: ISO-8601
selection: "1 | N | all | comma-separated topic ids"
queue_frozen: true
queue_fingerprint: sha256:<64 lowercase hex characters>
queue:
  - topic_id: topic_YYYYMMDD_NN
    position: 1
    status: queued
    current_stage: research-topic
topics: {}
metrics:
  queue_size: 0
  completed: 0
  blocked: 0
  cycles_per_stage: {}
  reviewer_coverage: 0.0
  human_writing_conformity: 0.0
  time_to_approval: null
# reviewer_coverage: mean coverage of all persisted review events
# human_writing_conformity: mean coverage of humanize_review_1 and humanize_review_2
# cycles_per_stage: highest committed cycle number per stage
# time_to_approval: ISO-8601 duration from created_at to approval_humana commit, or null
# Checkpoints require known status, result.artifact, result_path in results/<stage>-cycle-<NN>.yaml,
# review_path in reviews/cycle-<NN>.yaml, and paths in artifact/result/review order,
# relative paths inside the workspace, and a passing review gate (coverage >= 0.99,
# 14 criteria >= 9, no hard failures, and no unresolved feedback).
# Commit events require exactly the canonical event fields, evt_NNNN, an ISO-8601 timestamp, canonical paths,
# result.artifact equal to artifact_path, and a passing complete review.
